<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <alias><family>sans-serif</family><accept><family>Apple Color Emoji</family></accept></alias>
  <alias><family>serif</family><accept><family>Apple Color Emoji</family></accept></alias>
  <alias><family>monospace</family><accept><family>Apple Color Emoji</family></accept></alias>
</fontconfig>
